name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Testes + build debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache e wrapper validado)
        uses: gradle/actions/setup-gradle@v4

      - name: Executar testes unitários e montar APK debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Publicar relatório de testes (apenas em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
